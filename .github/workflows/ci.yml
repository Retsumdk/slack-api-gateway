name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests examples

      - name: Format check
        run: ruff format --check src tests examples

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest --cov=slack_api_gateway --cov-report=term-missing --cov-fail-under=90

      - name: Offline demo matches golden output
        run: |
          slack-gateway demo > /tmp/demo.txt
          diff -u demo-output.txt /tmp/demo.txt

      - name: Examples compile
        run: python -m compileall -q src examples

  package:
    name: build and install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/slack-gateway --version
          /tmp/venv/bin/slack-gateway demo | diff -u demo-output.txt -
          /tmp/venv/bin/python -c "import slack_api_gateway, pathlib; \
            assert (pathlib.Path(slack_api_gateway.__file__).parent / 'py.typed').exists()"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
