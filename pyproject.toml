[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-api-gateway"
version = "1.0.0"
description = "Slack Web API gateway: tier-aware pacing, jittered retries, typed errors, cursor pagination, zero runtime dependencies"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Retsumdk" }]
keywords = [
    "slack",
    "slack-api",
    "api-gateway",
    "rate-limiting",
    "retry",
    "backoff",
    "pagination",
    "bots",
    "chatops",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/Retsumdk/slack-api-gateway"
Repository = "https://github.com/Retsumdk/slack-api-gateway"
Issues = "https://github.com/Retsumdk/slack-api-gateway/issues"
Changelog = "https://github.com/Retsumdk/slack-api-gateway/blob/main/CHANGELOG.md"

[project.scripts]
slack-gateway = "slack_api_gateway.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slack_api_gateway = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["slack_api_gateway"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "RET", "PTH"]
ignore = [
    "S101",  # assert is the point in a test suite
    "RET504",  # a named value before return is often clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"src/slack_api_gateway/demo.py" = ["S105", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["slack_api_gateway"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
disallow_any_unimported = false
